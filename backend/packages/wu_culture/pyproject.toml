[project]
name = "wu-culture"
version = "0.1.0"
description = "Wu culture and Mudu regional-history domain services for Xingxi"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.4.0",
    "httpx>=0.28.1",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=12.1.0",
    "pypdfium2>=5.7.1",
    "pydantic>=2.12.5",
    "diff-match-patch>=20230430",
    "rapidfuzz>=3.0.0",
    "networkx>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wu_culture"]
