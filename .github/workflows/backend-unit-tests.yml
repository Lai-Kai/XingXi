name: Unit Tests

on:
  push:
    branches: [ 'main', '2.0.x-dev' ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run unit tests of backend
        working-directory: backend
        run: PYTHONPATH=. uv run pytest tests/ -v --junitxml=test-results/junit.xml
      - name: Upload backend test records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results
          path: backend/test-results/junit.xml
          if-no-files-found: error
          retention-days: 7
